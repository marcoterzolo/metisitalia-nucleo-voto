<!DOCTYPE html>
<!--
  =============================================================================
  docs/verifica.html - VERIFICA INDIPENDENTE DI UNA VOTAZIONE DI METIS ITALIA
  (pubblicata con GitHub Pages, FUORI dal server di METIS Italia; 21/11/2026)
  -----------------------------------------------------------------------------
  Pagina statica: nessun server, nessun dato salvato. Riceve il FILE DELL'URNA
  di una votazione chiusa (scaricato da "Scarica l'urna" nella pagina dei
  risultati, trascinato qui, oppure letto dal link dopo il # quando si arriva da
  "Verifica fuori dal nostro sito") e controlla, nel browser di chi la usa:
  firme di tutte le schede, riconteggio, elenco dei candidati, chiave e
  confronto con le copie salvate nel registro pubblico su GitHub
  (archivio marcoterzolo/metisitalia-registro-urne).
  21/11/2026 (notte): esito scritto per persone non tecniche, con la stessa
  struttura delle email di esito: verdetto in cima, poi i capitoli (cosa ha
  controllato, cosa e' risultato, cosa fare, riconteggio, dettaglio dei codici,
  come funziona la pagina). Calcoli invariati.
  Il calcolo usa AN05_blind.js, copia identica del file del nucleo del voto
  (la sua impronta e' mostrata in fondo e si confronta con IMPRONTE.md).
  Logica in verifica.js, testi in 5 lingue (it, en, es, de, fr).
  =============================================================================
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>METIS Italia - Verifica indipendente della votazione</title>
<style>
  :root { --blu: #15476c; --verde: #1e7e34; --rosso: #c82333; --giallo: #e0a800; --grigio: #5d6b78; --bordo: #d0d9e2; --fondo: #f4f6fb; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #2b3a47; background: var(--fondo); line-height: 1.55; }
  header { background: var(--blu); color: #fff; padding: 22px 16px; }
  header h1 { margin: 0 auto; max-width: 820px; font-size: 24px; }
  header p { margin: 6px auto 0; max-width: 820px; opacity: .9; font-size: 14px; }
  main { max-width: 820px; margin: 0 auto; padding: 18px 16px 40px; }
  .box { background: #fff; border: 1px solid var(--bordo); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .box_in { padding: 16px 18px; }
  .testa { background: #eef3f9; border-bottom: 1px solid var(--bordo); padding: 14px 18px; }
  .etichetta { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--grigio); }
  .testa h2 { margin: 4px 0 2px; font-size: 20px; color: var(--blu); }
  .testa .sotto { font-size: 13px; color: #495057; }
  .zona { border: 2px dashed var(--bordo); border-radius: 10px; padding: 26px; text-align: center; color: var(--grigio); cursor: pointer; }
  .zona.sopra { border-color: var(--blu); background: #eef4fa; }
  .verdetto { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 8px; border-left: 6px solid; font-size: 17px; font-weight: 700; margin: 0 0 6px; }
  .verdetto .ic { font-size: 20px; line-height: 1.2; }
  .v_ok { background: #e6f4ea; border-color: var(--verde); color: #145523; }
  .v_ko { background: #fdecea; border-color: var(--rosso); color: #8a1c24; }
  .v_att { background: #fff8e1; border-color: var(--giallo); color: #6b5200; }
  .v_corso { background: #eef3f9; border-color: var(--bordo); color: var(--grigio); font-weight: 400; }
  .sez { margin: 22px 0 8px; padding-bottom: 5px; border-bottom: 2px solid var(--blu); font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--blu); }
  .righe { list-style: none; margin: 0; padding: 0; }
  .righe li { display: flex; gap: 10px; padding: 6px 0; font-size: 15px; }
  .righe .ic { width: 20px; flex: 0 0 20px; font-weight: 700; }
  .r_ok .ic { color: var(--verde); } .r_ko { color: #8a1c24; font-weight: 600; } .r_ko .ic { color: var(--rosso); }
  .r_att .ic { color: #b38600; } .r_info .ic { color: var(--grigio); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; background: #f4f6fb; color: var(--grigio); font-size: 12px; padding: 7px 10px; }
  td { padding: 7px 10px; border-bottom: 1px solid #e9ecef; }
  td.n, th.n { text-align: right; }
  .codice { padding: 12px 0; border-top: 1px solid #e3e8ee; }
  .codice:first-of-type { border-top: 0; }
  .codice b { font-size: 15px; color: #1e2b37; }
  .codice .tec { font-size: 12px; color: #868e96; }
  .pill { display: inline-block; margin-top: 5px; border-radius: 12px; padding: 1px 9px; font-size: 12px; font-weight: 700; border: 1px solid; }
  .p_ok { background: #e6f4ea; color: var(--verde); } .p_ko { background: #fdecea; color: var(--rosso); } .p_att { background: #fff8e1; color: #6b5200; border-color: var(--giallo); }
  .valore { margin-top: 7px; font-family: Consolas, Menlo, monospace; font-size: 13px; word-break: break-all; padding: 6px 8px; border-radius: 4px; background: #f4f6fb; border: 1px solid #e3e8ee; }
  .val_ok { background: #f3faf5; border-color: #b7dfc2; color: #145523; } .val_ko { background: #fdf3f2; border-color: #f1b0b7; color: #8a1c24; }
  .orig { margin-top: 5px; font-size: 12px; color: #8a1c24; word-break: break-all; }
  .spieg { margin-top: 6px; font-size: 13px; color: var(--grigio); }
  .piccolo { font-size: 13px; color: var(--grigio); }
  code { word-break: break-all; font-size: 13px; }
  a.btn { display: inline-block; margin-top: 4px; padding: 7px 13px; border: 1px solid var(--blu); border-radius: 6px; color: var(--blu); font-weight: 700; font-size: 14px; text-decoration: none; }
  select { padding: 4px; }
  details summary { cursor: pointer; font-weight: 700; color: var(--blu); }
</style>
</head>
<body>
<header>
  <h1 id="t_titolo"></h1>
  <p id="t_sotto"></p>
</header>
<main>
  <div class="box"><div class="box_in">
    <p id="t_spiega"></p>
    <p class="piccolo"><label for="lingua" id="t_lingua"></label>
      <select id="lingua"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="fr">Français</option></select></p>
    <div class="zona" id="zona" tabindex="0" role="button"><span id="t_zona"></span>
      <input type="file" id="file" accept=".json,application/json" hidden></div>
    <p class="piccolo" id="origine"></p>
  </div></div>
  <div id="risultato" aria-live="polite"></div>
  <div class="box"><div class="box_in piccolo">
    <details><summary id="t_c6_t"></summary>
      <p id="t_come"></p>
      <p><span id="t_impjs"></span> <code id="impjs">...</code></p>
    </details>
  </div></div>
</main>
<script src="AN05_blind.js"></script>
<script src="verifica.js"></script>
</body>
</html>
